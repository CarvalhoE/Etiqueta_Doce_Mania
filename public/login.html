<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d6336c">
  <title>Entrar | Gerenciamento de Pedidos</title>
  <link rel="stylesheet" href="/css/login.css">
  <script src="/js/login.js" defer></script>
</head>
<body>
  <main class="login-pagina">
    <section class="login-painel" aria-labelledby="tituloLogin">
      <div id="loginMarcaFallback" class="login-marca-fallback" aria-hidden="true">DM</div>
      <img id="loginMarca" class="login-marca" alt="" hidden>
      <p id="loginSobretitulo" class="login-sobretitulo">Empresa</p>
      <h1 id="tituloLogin">Gerenciamento de Pedidos</h1>

      <form id="loginForm">
        <h2>Acesso administrativo</h2>
        <label for="usuario">Usuário</label>
        <input id="usuario" name="username" type="text" autocomplete="username" required autofocus>

        <label for="senha">Senha</label>
        <input id="senha" name="password" type="password" autocomplete="current-password" required>

        <p id="loginErro" class="login-erro" role="alert" hidden></p>
        <button id="entrar" type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
